<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luci di Casa Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:#f7f7f8;font-family:Inter,system-ui,sans-serif}button,select,input{font:inherit}
.app{max-width:720px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:28px;margin:8px 0}.dot{color:#74db91}
.rooms{display:flex;gap:8px;overflow:auto;padding:14px 0}.pill{border:0;border-radius:999px;padding:11px 17px;background:#1c2027;color:#abb2bd}.pill.active{background:#f4f4f4;color:#111}
.card{background:#181b21;border:1px solid #292e36;border-radius:22px;padding:18px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:750;font-size:18px}.muted{color:#8e96a3;font-size:13px}.switch{border:0;border-radius:999px;padding:10px 18px;background:#303640;color:white}.switch.on{background:#f4f4f4;color:#111}
label{display:block;color:#aeb4bd;font-size:13px;margin:16px 0 6px}input[type=range]{width:100%;height:34px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.btn{border:0;border-radius:14px;padding:14px;background:#272c34;color:#fff;font-weight:700}.primary{background:#f4f4f4;color:#111}
select{width:100%;background:#242931;color:white;border:1px solid #363c46;border-radius:14px;padding:14px}.checks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.check{background:#242931;border-radius:999px;padding:9px 12px}.check input{margin-right:5px}.scenes{display:flex;gap:8px;overflow:auto}.scene{white-space:nowrap;border:0;border-radius:14px;padding:13px 16px;background:#282d35;color:white}
.color{width:100%;height:48px;border:0;background:transparent}.status{font-size:12px;color:#8e96a3;margin-top:10px}

.control-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;color:#dce1e8;font-size:14px}.control-title output{color:#aeb4bd}
input.slider{display:block;appearance:none;-webkit-appearance:none;width:100%;height:48px;border-radius:999px;margin:0;cursor:pointer;touch-action:pan-y;background:linear-gradient(to right,#ffc23e var(--fill),#353a42 var(--fill))}
input.slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:26px;height:48px;border-radius:999px;background:#ffc23e;border:0}input.slider::-moz-range-thumb{width:26px;height:48px;border-radius:999px;background:#ffc23e;border:0}
input.warmth{height:74px;border-radius:20px;background:linear-gradient(90deg,#ffe3a0,#fff9ec 42%,#ffffff 60%,#d9eeff);border:1px solid #b7bbc1}
input.warmth::-webkit-slider-thumb{width:28px;height:72px;border-radius:9px;background:transparent;border:5px solid white;box-shadow:0 2px 8px #0005}input.warmth::-moz-range-thumb{width:20px;height:62px;border-radius:9px;background:transparent;border:5px solid white;box-shadow:0 2px 8px #0005}
.spectrum{height:126px;border-radius:20px;position:relative;touch-action:none;cursor:crosshair;background:linear-gradient(to bottom,rgba(255,255,255,.9),transparent),linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);outline-offset:4px}
.marker{position:absolute;width:25px;height:25px;border:3px solid white;border-radius:50%;box-shadow:0 1px 5px #0009;transform:translate(-50%,-50%);pointer-events:none}
.preview{display:flex;align-items:center;gap:10px;margin:12px 0;color:#c4cbd5;font-size:13px}.chip{width:28px;height:28px;border-radius:50%;border:2px solid #ffffff88;background:var(--selected)}
.presets{display:flex;gap:12px;overflow-x:auto;padding:8px 3px 12px}.swatch{flex:0 0 44px;width:44px;height:44px;border:2px solid #ffffff55;border-radius:50%;background:var(--swatch);cursor:pointer}.swatch[aria-pressed=true]{outline:3px solid #68b9f1;outline-offset:3px}

.usage-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.usage-summary small{display:block;color:#939dac;font-size:11px;margin-bottom:7px}.usage-summary strong{font-size:17px}.history-btn{width:100%}dialog{width:min(680px,calc(100% - 24px));max-height:90dvh;overflow:auto;background:#181b21;color:#f7f7f8;border:1px solid #363c46;border-radius:22px;padding:20px}dialog::backdrop{background:#000a}dialog h2{font-size:20px}dialog input[type=number]{width:140px;background:#242931;color:white;border:1px solid #505866;border-radius:10px;padding:12px}.power-chart{width:100%;background:#11151b;border-radius:12px}.power-chart text{fill:#aeb7c5;font-size:12px}.bars{display:flex;gap:10px;overflow:auto;padding:12px 0}.bar-column{flex:1;min-width:38px;text-align:center;font-size:10px}.bar-track{height:120px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0}.bar{width:26px;background:#ffc23e;border-radius:6px 6px 0 0}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:10px 5px;border-bottom:1px solid #343a44}
.top{flex-wrap:wrap;gap:8px}#tapoForm input{width:100%;padding:13px;background:#242931;color:white;border:1px solid #505866;border-radius:10px}#tapoSave{margin-top:10px}.offline{color:#ffa880}
.quarter-scroll{overflow-x:auto;margin:14px 0}.quarter-bars{display:flex;gap:8px;padding:8px 0}.quarter-column{flex:0 0 48px;text-align:center;font-size:10px}.partial-bar{background:repeating-linear-gradient(45deg,#ffc23e 0 5px,#806620 5px 9px)}input[type=date]{background:#242931;color:white;border:1px solid #505866;border-radius:10px;padding:10px}details{margin:14px 0}summary{cursor:pointer;color:#cbd4e0}
</style></head><body><main class="app"><div class="top"><h1>⌂ Luci di Casa Mobile</h1><span class="dot">● locale</span><button class=btn onclick="openTapoAuth()">Account Tapo</button></div>
<div id="rooms" class="rooms"></div><div id="content"></div></main>
<dialog id="tapoDialog"><form id="tapoForm" onsubmit="saveTapoAuth(event)"><div class=row><h2>Account Tapo</h2><button type=button class=btn onclick="document.getElementById('tapoDialog').close()">✕</button></div><p class=muted>Usa l’account proprietario della lampadina. In Tapo lascia abilitata la compatibilità con terze parti.</p><label for=tapoEmail>Email</label><input id=tapoEmail type=email autocomplete=username required><label for=tapoPassword>Password</label><input id=tapoPassword type=password autocomplete=current-password required><p class=muted>Le credenziali vengono salvate sul dispositivo che esegue Luci di Casa e usate per collegarsi alla Tapo sulla rete locale.</p><button id=tapoSave class="btn primary" type=submit>Verifica e salva</button><div id=tapoMessage class=status></div></form></dialog><dialog id="usageDialog"><div class=row><h2 id="usageTitle">Utilizzo e consumi</h2><button class=btn aria-label="Chiudi storico" onclick="document.getElementById('usageDialog').close();usageGeneration++">✕</button></div><label>Periodo</label><select aria-label="Periodo storico" onchange="usageDays=+this.value;refreshUsage()"><option value=1>Oggi</option><option value=7 selected>Ultimi 7 giorni</option><option value=30>Ultimi 30 giorni</option></select><div id="usageBody"></div></dialog><script>
function duration(seconds){let m=Math.floor(seconds/60);return Math.floor(m/60)+' h '+(m%60)+' min'}
function intervalChart(q){if(!q)return '';if(!q.bins.length)return '<p class=muted>La lampadina conserva il dettaglio a 15 minuti soltanto per il giorno corrente. Per la settimana usa le fasce di 2 ore qui sotto.</p>';let values=q.bins.filter(b=>b.wh!=null),max=Math.max(.01,...values.map(b=>b.wh)),format=t=>new Date(t*1000).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',...(q.timezone?{timeZone:q.timezone}:{})}),date=t=>new Date(t*1000).toLocaleDateString('it-IT',q.timezone?{timeZone:q.timezone}:{});return `<div class="quarter-scroll"><div class="quarter-bars" role=img aria-label="Energia e tempo acceso per intervallo, valori nella tabella">${q.bins.map(b=>`<div class=quarter-column title="${date(b.start)} ${format(b.start)}–${format(b.end)}: ${b.wh==null?'nessun dato':b.wh.toFixed(3)+' Wh'}"><span>${b.wh==null?'—':b.wh.toFixed(2)}</span><div class=bar-track>${b.wh==null?`<span class=muted>${b.status==='future'?'':'?'}</span>`:`<div class="bar ${b.status==='partial'?'partial-bar':''}" style="height:${b.wh/max*100}%;min-height:${b.wh===0?'2px':'0'}"></div>`}</div><small>${q.minutes===120?date(b.start)+'<br>':''}${format(b.start)}</small></div>`).join('')}</div></div><p class=muted>Scorri per vedere tutti gli intervalli. Barre tratteggiate: dati parziali. “—”: dati mancanti o intervallo futuro. Zero: nessun incremento osservato.${q.source==='tapo'?' Tapo restituisce Wh interi: gli arrotondamenti possono produrre zeri e salti.':''}</p><details><summary>Energia, tempo acceso e copertura</summary><div class=table-scroll><table><thead><tr><th>Intervallo</th><th>Wh</th><th>Accesa</th><th>Copertura</th></tr></thead><tbody>${q.bins.filter(b=>b.status!=='future').map(b=>`<tr><td>${date(b.start)} ${format(b.start)}–${format(b.end)}</td><td>${b.wh==null?'—':b.wh.toFixed(3)}</td><td>${b.on_seconds==null?'—':duration(b.on_seconds)}</td><td>${b.status==='missing'?'Assente':b.status==='partial'?'Parziale':'Completa'} (${Math.round(b.coverage_seconds/60)} min)</td></tr>`).join('')}</tbody></table></div></details>`}
function quarterChart(u){let q=u.quarters;if(!q)return '';return `<label>Energia ogni 15 minuti · Wh</label>${q.source==='shelly_device'?`<p class=muted>Giorno corrente della Shelly: ${q.date} · ${q.timezone}</p>`:`<input type=date aria-label="Giorno del grafico a 15 minuti" value="${q.date}" onchange="intervalDate=this.value;refreshUsage()">`}${intervalChart(q)}`}
function shellyLoggerNote(u){let d=u.device_history;return d?`<p class=muted>Storico salvato nella Shelly: 30 giorni di totali giornalieri, 7 giorni a fasce di 2 ore, oggi ogni 15 minuti. Registrazione autonoma anche con app e Termux chiusi. Fuso: ${escapeText(d.timezone)}. Ultima sincronizzazione: ${new Date(d.updated_at*1000).toLocaleString('it-IT')}. Salvataggio permanente ogni 15 minuti: togliendo corrente si può perdere la parte successiva all’ultimo salvataggio. I periodi senza registrazioni restano mancanti.${d.error?' Sincronizzazione non riuscita: '+escapeText(d.error):''}</p>`:`<p class=muted>Monitoraggio interno Shelly non disponibile: ${escapeText(u.logger_error||'in attesa')}. I grafici attuali usano le letture locali dell’app.</p>`}


function tapoUsageCard(ip){let summary=S.devices?.[ip]?.native_usage||S.usage?.[ip]?.native?.summary,d=summary?.periods?.today;return `<div class="usage-summary"><div><small>Tempo acceso oggi · Tapo</small><strong>${d?.on_seconds!=null?duration(d.on_seconds):'—'}</strong></div><div><small>Energia oggi · Tapo</small><strong>${d?.wh!=null?d.wh.toFixed(2)+' Wh':'—'}</strong></div><div><small>Potenza istantanea</small><strong>—</strong></div></div><p class=muted>Consumi riportati dalla lampadina tramite Tapo. Potenza istantanea non disponibile.${summary?' Data: '+summary.date:''}</p><button class="btn history-btn" onclick="openUsage('${ip}')">↗ Utilizzo e consumi</button>`}
function renderTapoUsage(u){let n=u.native,summary=n.summary,p=summary.periods[usageDays===1?'today':usageDays===7?'past7':'past30'],known=n.daily.filter(d=>d.wh!=null),max=Math.max(1,...known.map(d=>d.wh));return `<div class="usage-summary"><div><small>Energia nel periodo · Tapo</small><strong>${p.wh!=null?p.wh.toFixed(2)+' Wh':'—'}</strong></div><div><small>Tempo acceso · Tapo</small><strong>${p.on_seconds!=null?duration(p.on_seconds):'—'}</strong></div><div><small>Costo stimato</small><strong>${p.wh!=null?(p.wh/1000*u.tariff).toFixed(3)+' €':'—'}</strong></div></div><p class=muted>Riepilogo della lampadina per ${usageDays===1?'oggi':'gli ultimi '+usageDays+' giorni'}. Data Tapo: ${summary.date}. Ultima lettura: ${new Date(summary.updated_at*1000).toLocaleString('it-IT')}.</p><label>Tariffa elettrica (€/kWh)</label><div class=row><input id=tariff type=number min=0 max=100 step=0.01 value="${u.tariff}" aria-label="Tariffa euro per kilowattora"><button class=btn onclick="saveTariff()">Salva</button></div>${quarterChart(u)}<label>Consumo giornaliero · Wh</label><div class=bars role=img aria-label="Consumi giornalieri Tapo, valori nella tabella">${n.daily.map(d=>`<div class=bar-column><span>${d.wh==null?'—':d.wh.toFixed(1)}</span><div class=bar-track>${d.wh==null?'<span class=muted>?</span>':`<div class=bar style="height:${d.wh/max*100}%"></div>`}</div><small>${d.date.slice(5)}</small></div>`).join('')}</div><div class=table-scroll><table><thead><tr><th>Giorno</th><th>Accesa</th><th>Wh</th><th>Ultima lettura</th></tr></thead><tbody>${n.daily.map(d=>`<tr><td>${d.date}</td><td>${d.on_seconds==null?'—':duration(d.on_seconds)}</td><td>${d.wh==null?'—':d.wh.toFixed(2)}</td><td>${d.updated_at?new Date(d.updated_at*1000).toLocaleTimeString('it-IT'):'—'}</td></tr>`).join('')}</tbody></table></div><p class=muted>I totali oggi/7/30 giorni provengono direttamente dalla Tapo. Il grafico giornaliero conserva l’ultima lettura di ciascun giorno: i giorni senza letture restano sconosciuti e non sono conteggiati come zero. Per un giorno passato la lettura può essere parziale, se Termux era fermo a fine giornata. È normale che la somma delle barre differisca dal riepilogo del periodo. L’energia viene riportata come dato Tapo; questo endpoint non documenta come il firmware la misuri o la stimi. Nessun grafico di potenza istantanea disponibile.</p>`}

function usageCard(ip){if(S.data.devices[ip]?.type==='tapo')return tapoUsageCard(ip);let u=S.usage?.[ip],d=u?.daily?.[0],last=u?.latest,fresh=last&&u.now-last.ts<45,energy=d?.energy_seconds>0;return `<div class="usage-summary"><div><small>Potenza attuale</small><strong>${fresh&&last.power!=null?last.power.toFixed(1)+' W':'—'}</strong></div><div><small>Accesa oggi ≈</small><strong>${duration(d?.on_seconds||0)}</strong></div><div><small>Consumo registrato oggi</small><strong>${energy?(d.wh||0).toFixed(2)+' Wh':'—'}</strong></div></div><button class="btn history-btn" onclick="openUsage('${ip}')">↗ Utilizzo e consumi</button>`}
function openTapoAuth(){document.getElementById('tapoEmail').value=S.tapo_auth?.username||'';document.getElementById('tapoPassword').value='';document.getElementById('tapoMessage').textContent=S.tapo_auth?.configured?'Account già configurato. Puoi aggiornarlo.':'Inserisci il tuo account per collegare Lampada Cucina.';document.getElementById('tapoDialog').showModal()}
async function saveTapoAuth(event){event.preventDefault();let button=document.getElementById('tapoSave'),message=document.getElementById('tapoMessage');button.disabled=true;message.textContent='Verifica della connessione alla Tapo…';try{let result=await api('/api/tapo/auth',{username:document.getElementById('tapoEmail').value,password:document.getElementById('tapoPassword').value});if(result.ok){document.getElementById('tapoPassword').value='';document.getElementById('tapoDialog').close();await load()}else message.textContent='Connessione non riuscita: '+result.error}catch(e){message.textContent='Connessione non riuscita: '+e.message}finally{button.disabled=false}}

let usageIP,usageDays=7,usageGeneration=0,intervalDate='';
async function openUsage(ip){usageIP=ip;let dialog=document.getElementById('usageDialog');if(!dialog.open)dialog.showModal();await refreshUsage()}
async function refreshUsage(){const gen=++usageGeneration;document.getElementById('usageBody').textContent='Caricamento…';try{let response=await fetch('/api/usage?ip='+encodeURIComponent(usageIP)+'&days='+usageDays+(intervalDate?'&date='+encodeURIComponent(intervalDate):''));let u=await response.json();if(!response.ok)throw Error(u.error);if(gen!==usageGeneration)return;if(u.native){document.getElementById('usageTitle').textContent=S.data.devices[usageIP]?.name||usageIP;document.getElementById('usageBody').innerHTML=renderTapoUsage(u);return}const hasEnergy=u.daily.some(d=>d.energy_seconds>0),total=u.daily.reduce((a,d)=>a+d.wh,0),on=u.daily.reduce((a,d)=>a+d.on_seconds,0);document.getElementById('usageTitle').textContent=S.data.devices[usageIP]?.name||usageIP;document.getElementById('usageBody').innerHTML=`<div class="usage-summary"><div><small>Energia registrata</small><strong>${hasEnergy?total.toFixed(2)+' Wh':'—'}</strong></div><div><small>Tempo acceso ≈</small><strong>${duration(on)}</strong></div><div><small>Costo stimato</small><strong>${hasEnergy?(total/1000*u.tariff).toFixed(3)+' €':'—'}</strong></div></div><label>Tariffa elettrica (€/kWh)</label><div class=row><input id=tariff type=number min=0 max=100 step=0.01 value="${u.tariff}" aria-label="Tariffa euro per kilowattora"><button class=btn onclick="saveTariff()">Salva</button></div><label>Potenza nelle ultime 24 ore · W</label>${powerChart(u.points,u.now)}<p class=muted>Le interruzioni della linea indicano campioni mancanti. Il grafico della potenza mostra al massimo un punto al minuto.</p>${quarterChart(u)}${u.two_hours?'<label>Ultimi 7 giorni · energia ogni 2 ore · Wh</label>'+intervalChart(u.two_hours):''}${shellyLoggerNote(u)}<label>Consumo giornaliero · Wh</label>${hasEnergy?dailyChart(u.daily):'<p class=muted>Nessuna misura di energia disponibile. Il tempo acceso è riportato nella tabella.</p>'}<div class="table-scroll"><table><thead><tr><th>Giorno</th><th>Accesa ≈</th><th>Wh</th><th>Senza dati</th></tr></thead><tbody>${u.daily.map(d=>`<tr><td>${d.date.slice(5)}</td><td>${duration(d.on_seconds)}</td><td>${d.energy_seconds?d.wh.toFixed(2):'—'}</td><td>${duration(d.unknown_seconds)}</td></tr>`).join('')}</tbody></table></div><p class=muted>Il grafico della potenza usa campioni locali e richiede l’app in esecuzione. Energia e minuti nei grafici dello storico interno provengono dalla lampadina. Il tempo acceso è campionato ogni 10 secondi e aggiornato ai cambi di accensione. Il monitoraggio non ricostruisce dati precedenti all’installazione.</p>`}catch(e){if(gen===usageGeneration)document.getElementById('usageBody').textContent='Errore: '+e.message}}
async function saveTariff(){let v=+document.getElementById('tariff').value;if(!Number.isFinite(v)||v<0||v>100)return alert('Inserisci una tariffa valida');let result=await api('/api/usage/tariff',{tariff:v});if(result.ok){await refreshUsage();await load()}}
function dailyChart(days){let max=Math.max(1,...days.map(d=>d.wh));return `<div class=bars role=img aria-label="Consumo giornaliero"><div style="display:contents">${days.map(d=>`<div class=bar-column title="${d.date}: ${d.energy_seconds?d.wh.toFixed(2)+' Wh':'nessun dato'}"><span>${d.energy_seconds?d.wh.toFixed(1):'—'}</span><div class=bar-track>${d.energy_seconds?`<div class=bar style="height:${d.wh/max*100}%;min-height:2px"></div>`:'<span class=muted>?</span>'}</div><small>${d.date.slice(5)}</small></div>`).join('')}</div></div>`}

function powerChart(points,now){let valid=points.filter(p=>p.power!=null);if(!valid.length)return '<p class=muted>In attesa dei primi campioni di potenza.</p>';let max=Math.max(1,...valid.map(p=>p.power)),paths=[],path='',prev=null,lastDraw=-Infinity;for(const p of points){if(p.power==null){if(path)paths.push(path);path='';prev=null;continue}if(prev&&p.ts-prev.ts>45){if(path)paths.push(path);path='';lastDraw=-Infinity}let gap=!prev||p.ts-prev.ts>45;prev=p;if(!gap&&p.ts-lastDraw<60)continue;let x=40+(p.ts-(now-86400))/86400*560,y=155-p.power/max*125;path+=(path?' L':'M')+x.toFixed(2)+','+y.toFixed(2);lastDraw=p.ts}if(path)paths.push(path);return `<svg class="power-chart" viewBox="0 0 620 185" role="img" aria-label="Potenza ultime 24 ore, massimo ${max.toFixed(1)} watt"><path d="M40,25 V155 H600" fill="none" stroke="#6f7785"/><text x=0 y=30>${max.toFixed(1)}</text><text x=15 y=155>0</text><text x=40 y=178>−24 h</text><text x=555 y=178>Ora</text>${paths.map(d=>`<path d="${d}" fill="none" stroke="#ffc23e" stroke-width="2.5"/><circle cx="${d.split(/[ML]/).filter(Boolean)[0].split(',')[0]}" cy="${d.split(/[ML]/).filter(Boolean)[0].split(',')[1]}" r="2" fill="#ffc23e"/>`).join('')}</svg>`}

function musicDetectorStep(d,rms,spectrum,sampleRate,fftSize,now,sensitivity){
 // Positive spectral flux: attacks across bass, mids and treble (35-8000 Hz).
 let first=Math.max(1,Math.ceil(35*fftSize/sampleRate)),last=Math.min(spectrum.length-1,Math.floor(8000*fftSize/sampleRate));
 let positive=0,total=0;
 if(!d.previous){d.previous=new Float32Array(spectrum.length);d.started=now;d.last=now;d.fluxMean=0;d.fluxDev=0;d.rmsMean=rms;d.lastBeat=-Infinity;d.candidate=false;}
 let dt=Math.max(1,Math.min(100,now-d.last)),alpha=1-Math.exp(-dt/1200);
 for(let i=first;i<=last;i++){
  let amplitude=Number.isFinite(spectrum[i])?Math.pow(10,spectrum[i]/20):0;
  positive+=Math.max(0,amplitude-d.previous[i]);total+=amplitude;d.previous[i]=amplitude;
 }
 let flux=total>1e-8?positive/total:0;
 let gain=Math.max(1,Math.min(20,sensitivity)),factor=2.6-1.35*(gain-1)/19;
 let threshold=Math.max(.012,d.fluxMean*factor+d.fluxDev*(1.1-.7*(gain-1)/19));
 let audible=rms*gain>.004;
 let energyAttack=rms>Math.max(1e-7,d.rmsMean)*(1.38-.27*(gain-1)/19);
 let candidate=audible&&(flux>threshold||(energyAttack&&flux>.008));
 let beat=now-d.started>=250&&candidate&&!d.candidate&&now-d.lastBeat>115;
 if(beat)d.lastBeat=now;
 d.candidate=candidate;d.fluxDev+=alpha*(Math.abs(flux-d.fluxMean)-d.fluxDev);
 d.fluxMean+=alpha*(flux-d.fluxMean);d.rmsMean+=alpha*(rms-d.rmsMean);d.last=now;
 return {beat,flux,threshold,audible,strength:Math.max(0,Math.min(1,(flux-threshold)/Math.max(.02,threshold)))};
}

let music=null,musicEpoch=0,musicMessage='Musica ferma',musicGain=6,musicLimit=85,musicSource='microphone',musicFile=null;
function musicStatus(message){musicMessage=message;let el=document.getElementById('musicStatus');if(el)el.textContent=message;}
async function musicPost(path,body){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});let j=await r.json();if(!r.ok)throw Error(j.error||'Richiesta musicale fallita');return j;}finally{clearTimeout(timer);}}
function attachMusicPlayer(){let host=document.getElementById('musicPlayer');if(host&&music?.player)host.appendChild(music.player);}
async function chooseMusicSource(value){await stopMusic();musicSource=value;draw();}
async function chooseMusicFile(file){await stopMusic();musicFile=file||null;musicStatus(musicFile?'File selezionato: '+musicFile.name:'Seleziona un file audio');let label=document.getElementById('musicFilename');if(label)label.textContent=musicFile?.name||'Nessun file scelto';}
async function stopMusic(message='Musica ferma'){
 musicEpoch++;let m=music;music=null;musicStatus(message);
 if(!m)return;
 cancelAnimationFrame(m.raf);m.stream?.getTracks().forEach(t=>t.stop());
 if(m.player){m.player.pause();m.player.removeAttribute('src');m.player.load();m.player.remove();}
 if(m.url)URL.revokeObjectURL(m.url);
 try{await m.context?.close();}catch(e){}
 if(m.token)try{await musicPost('/api/music/stop',{token:m.token});}catch(e){}
}
async function startMusic(){
 if(music){await stopMusic();return musicStatus('Musica fermata. Premi Avvia musica per ripartire.');}
 stopMusic();let ips=targets();if(!ips.length)return musicStatus('Seleziona almeno una lampadina negli effetti.');
 if(musicSource==='file'&&!musicFile)return musicStatus('Scegli prima una canzone dal dispositivo.');
 if(musicSource!=='file'&&!window.isSecureContext)return musicStatus('Apri http://localhost:8000: microfono e condivisione richiedono localhost oppure HTTPS.');
 if(musicSource==='microphone'&&!navigator.mediaDevices?.getUserMedia)return musicStatus('Microfono non disponibile in questo browser.');
 if(musicSource==='internal'&&!navigator.mediaDevices?.getDisplayMedia)return musicStatus('Audio interno non disponibile in questo browser/dispositivo. Usa microfono o file.');
 let epoch=musicEpoch,m={stream:null,context:null,token:null,raf:0,kind:musicSource};music=m;musicStatus(m.kind==='internal'?'Scegli una scheda o schermata e abilita la condivisione audio…':m.kind==='file'?'Preparazione canzone…':'Consenti il microfono nel browser…');
 try{
  const AudioElement=window.Audio;const Audio=window.AudioContext||window.webkitAudioContext;m.context=new Audio();
  let resumed=m.context.resume(),source;
  if(m.kind==='file'){
   m.player=new AudioElement();m.player.controls=true;m.player.preload='auto';m.player.style.width='100%';
   m.url=URL.createObjectURL(musicFile);m.player.src=m.url;
   source=m.context.createMediaElementSource(m.player);attachMusicPlayer();
   m.player.onended=()=>{if(music===m)stopMusic('Canzone terminata');};
   m.player.onerror=()=>{if(music===m)stopMusic('Formato audio non leggibile: prova un MP3 o WAV.');};
   m.player.onpause=()=>{if(music===m)m.lastBeat=-Infinity;};
   // Start playback within the user's activation, before waiting for network.
   await m.player.play();
  }else{
   m.stream=await (m.kind==='internal'?navigator.mediaDevices.getDisplayMedia({video:true,audio:true,systemAudio:'include'}):navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false}));
   if(!m.stream.getAudioTracks().length)throw Error('La condivisione non contiene audio. Scegli una scheda con audio e spunta Condividi audio; se manca questa opzione usa microfono o file.');
   source=m.context.createMediaStreamSource(m.stream);
   m.stream.getTracks().forEach(t=>t.onended=()=>{if(music===m)stopMusic('Sorgente audio disconnessa');});
  }
  await resumed;
  if(epoch!==musicEpoch){m.stream?.getTracks().forEach(t=>t.stop());if(m.player){m.player.pause();m.player.remove();}if(m.url)URL.revokeObjectURL(m.url);try{await m.context.close();}catch(e){}return;}
  let analyser=m.context.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.4;source.connect(analyser);
  if(m.kind==='file')analyser.connect(m.context.destination);
  let response=await musicPost('/api/music/start',{ips});m.token=response.token;
  if(epoch!==musicEpoch){await musicPost('/api/music/stop',{token:m.token});return;}
  m.channels=(response.ips||ips).map(ip=>({ip,interval:response.device_intervals?.[ip]||response.interval_ms||300,lastSent:-Infinity,sending:false,seq:0,pendingBeat:0,active:true}));m.sent=0;m.hue=0;m.detector={};m.lastBeat=-Infinity;m.beatStrength=1;m.beats=0;

  let wave=new Float32Array(analyser.fftSize),spectrum=new Float32Array(analyser.frequencyBinCount);
  const tick=now=>{
   if(music!==m||epoch!==musicEpoch)return;
   if(m.context.state!=='running'){stopMusic('Audio sospeso: premi Avvia musica per riprendere');return;}
   analyser.getFloatTimeDomainData(wave);analyser.getFloatFrequencyData(spectrum);
   let rms=0;for(let x of wave)rms+=x*x;rms=Math.sqrt(rms/wave.length);
   let detection=musicDetectorStep(m.detector,rms,spectrum,m.context.sampleRate,analyser.fftSize,now,musicGain);
   let beat=detection.beat;
   if(beat){m.lastBeat=now;m.beatStrength=detection.strength;m.hue=(m.hue+(detection.strength>.5?67:31))%360;m.beats++;for(let channel of m.channels)channel.pendingBeat=m.beats;}
   let pulse=Math.max(0,1-(now-m.lastBeat)/200),level=Math.min(1,rms*musicGain*3);
   let brightness=Math.round(5+(musicLimit-5)*Math.min(1,level*.45+pulse*(.4+.4*m.beatStrength)));
   let meter=document.getElementById('musicLevel');if(meter)meter.value=level;
   musicStatus((m.kind==='file'?'File musicale':m.kind==='internal'?'Audio interno':'Microfono')+' · colpi: '+m.beats+' · cambi inviati: '+m.sent);
   for(let channel of m.channels){
    if(!channel.active||channel.sending||now-channel.lastSent<channel.interval)continue;
    // Send on an onset, on a brightness change, or a lease heartbeat.
    if(!channel.pendingBeat&&Math.abs((channel.brightness??-100)-brightness)<8&&now-channel.lastSent<2500)continue;
    channel.sending=true;channel.lastSent=now;channel.pendingBeat=0;channel.brightness=brightness;
    let frame={token:m.token,ips:[channel.ip],seq:++channel.seq,rgb:rgbFromHS(m.hue,.95),brightness};
    musicPost('/api/music/frame',frame).then(r=>{
     if(music!==m)return;
     if(r.active?.includes(channel.ip))m.sent++;
     else{channel.active=false;channel.error=r.errors?.[channel.ip]||'Fermata da un altro comando';}
     if(!m.channels.some(c=>c.active))stopMusic('Musica fermata: '+channel.error);
    }).catch(e=>{if(music===m){channel.active=false;channel.error=e.message;if(!m.channels.some(c=>c.active))stopMusic('Musica interrotta: '+e.message);}}).finally(()=>{channel.sending=false;});
   }
   m.raf=requestAnimationFrame(tick);
  };
  m.raf=requestAnimationFrame(tick);
 }catch(e){if(epoch===musicEpoch)await stopMusic(e.name==='NotAllowedError'?'Accesso audio negato o condivisione annullata: riprova e consenti l’accesso.':'Avvio audio fallito: '+e.message);}
}
document.addEventListener?.('visibilitychange',()=>{if(document.hidden&&music&&!(music.kind==='internal'&&!music.token))stopMusic('Musica fermata: pagina in secondo piano');});
window.addEventListener?.('pagehide',()=>{if(music){music.stream?.getTracks().forEach(t=>t.stop());navigator.sendBeacon?.('/api/music/stop',new Blob([JSON.stringify({token:music.token})],{type:'application/json'}));}});

let selectedFX='Party',manualSelections={},effectSelections={};
let S,room,roomBrightness=60,selectedCT=3000,hue=18,saturation=1,selectedColor='#ff4d00',dragging=false;
const presets=[['Bianco caldo','#ffedcb',3000],['Bianco freddo','#e4f3ff',6500],['Blu','#0000ff'],['Rosso','#ff0000'],['Verde','#00ff00'],['Viola','#aa22ff'],['Giallo','#ffff00'],['Rosa','#ff50aa'],['Turchese','#00ddcc']];
function brightnessControl(value,target){value=Math.max(1,Math.min(100,value));return `<div class="control-title"><span>☀ Luminosità</span><output>${value}%</output></div><input class="slider" aria-label="Luminosità ${target==='room'?'stanza':'lampada'}" type="range" min="1" max="100" value="${value}" style="--fill:${value}%" oninput="this.style.setProperty('--fill',this.value+'%');this.previousElementSibling.querySelector('output').textContent=this.value+'%'" onchange="brightnessChanged(this, '${target}')">`}
function brightnessChanged(el,target){if(target==='room')roomBrightness=+el.value;set(target==='room'?manualTargets():[target],{brightness:+el.value})}
function applyWhite(){set(manualTargets(),{mode:'cct',ct:selectedCT})}
function rgbFromHS(h,s){let c=s,x=c*(1-Math.abs((h/60)%2-1)),m=1-c;let v=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return v.map(n=>Math.round((n+m)*255))}
function updatePreview(){let rgb=rgbFromHS(hue,saturation);selectedColor='#'+rgb.map(n=>n.toString(16).padStart(2,'0')).join('');document.getElementById('chip').style.setProperty('--selected',selectedColor);document.getElementById('colorValue').textContent=selectedColor.toUpperCase();let marker=document.getElementById('marker');marker.style.left=(hue/360*100)+'%';marker.style.top=(saturation*100)+'%';let spectrum=document.getElementById('spectrum');spectrum.setAttribute('aria-valuenow',Math.round(hue));spectrum.setAttribute('aria-valuetext',selectedColor);document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',b.dataset.color.toLowerCase()===selectedColor))}
function bindSpectrum(){let el=document.getElementById('spectrum');const pick=e=>{let r=el.getBoundingClientRect();hue=Math.max(0,Math.min(359.99,(e.clientX-r.left)/r.width*360));saturation=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));updatePreview()};el.onpointerdown=e=>{dragging=true;el.setPointerCapture(e.pointerId);pick(e)};el.onpointermove=e=>{if(dragging)pick(e)};el.onpointerup=e=>{if(!dragging)return;pick(e);dragging=false;colorRoom(selectedColor)};el.onpointercancel=()=>{dragging=false};el.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();hue=(hue+(e.key==='ArrowRight'?3:e.key==='ArrowLeft'?-3:0)+360)%360;saturation=Math.max(0,Math.min(1,saturation+(e.key==='ArrowDown'?.05:e.key==='ArrowUp'?-.05:0)));updatePreview();colorRoom(selectedColor)};updatePreview()}
function preset(hex,ct){if(ct){selectedCT=ct;document.getElementById('ct').value=ct;document.getElementById('kelvin').textContent=ct+' K';applyWhite()}else{let rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255),max=Math.max(...rgb),min=Math.min(...rgb),d=max-min;hue=d===0?0:max===rgb[0]?60*((rgb[1]-rgb[2])/d%6):max===rgb[1]?60*((rgb[2]-rgb[0])/d+2):60*((rgb[0]-rgb[1])/d+4);hue=(hue+360)%360;saturation=max===0?0:d/max;updatePreview();colorRoom(hex)}document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',b.dataset.color===hex))}

async function api(path,x){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});let j=await r.json();if(!r.ok)alert(j.error);else if(j.errors&&Object.keys(j.errors).length)alert(Object.entries(j.errors).map(([ip,e])=>(S.data.devices[ip]?.name||ip)+': '+e).join('\n'));return j}
async function load(retry=false){S=await (await fetch('/api/state'+(retry===true?'?retry=1':''))).json();room=room||Object.keys(S.data.rooms)[0];draw()}
function draw(){rooms.innerHTML='';Object.keys(S.data.rooms).forEach(r=>{let b=document.createElement('button');b.className='pill '+(r===room?'active':'');b.textContent=r;b.onclick=()=>{room=r;draw()};rooms.appendChild(b)})
let ips=S.data.rooms[room]||[],h='';manualSelections[room]??=[...ips];effectSelections[room]??=[...ips];
ips.forEach(ip=>{let d=S.data.devices[ip]||{},st=(S.devices||{})[ip]||{};h+=`<section class=card><div class=row><div><div class=name>💡 ${d.name||'Lampada'}</div><div class=muted>${ip} · ${d.type==='tapo'?'Tapo':'Shelly'} · ${st.mode||'?'}</div></div><button ${st.error?'disabled':''} class="switch ${st.output?'on':''}" onclick='set(["${ip}"],{on:${!st.output}})'>${st.output?'ON':'OFF'}</button></div>${st.error?`<p class="status offline">${escapeText(st.error)}</p>`:brightnessControl(st.brightness??50,ip)}${usageCard(ip)}<div class="status">${deviceEffectStatus(ip)}</div></section>`})
h+=`<section class=card><div class=name>✨ Effetti autonomi</div><p class=muted>Continuano sulla lampadina anche con Termux chiuso. Un comando manuale ferma l’effetto. Sulla Tapo sono disponibili Party e Relax interni.</p><div class=checks>${ips.map(ip=>`<label class=check><input class=target type=checkbox value="${ip}" ${S.disabled_devices?.[ip]?'disabled':effectSelections[room].includes(ip)?'checked':''} onchange="effectSelections[room]=targets();updateEffectOptions()">${S.data.devices[ip]?.name||ip}${S.disabled_devices?.[ip]?' · esclusa':''}</label>`).join('')}</div><select id=fx onchange="selectedFX=this.value"></select><div class=actions><button class="btn primary" onclick=startfx()>▶ PLAY</button><button class=btn onclick=stopfx()>■ STOP</button></div><div id=fxst class=status>${roomEffectStatus(ips)}</div></section>
<section class=card><div class=name>🎵 Musica e luci</div><p class=muted>Scegli le lampadine con le caselle degli effetti qui sopra. Gli attacchi della musica su bassi, medi e alti cambiano il colore; l’intensità regola la luminosità.</p><label>Sorgente audio</label><select aria-label="Sorgente musicale" onchange="chooseMusicSource(this.value)"><option value=microphone ${musicSource==='microphone'?'selected':''}>Microfono del telefono o PC</option><option value=internal ${musicSource==='internal'?'selected':''}>Audio interno · condivisione browser</option><option value=file ${musicSource==='file'?'selected':''}>Canzone dal dispositivo</option></select>${musicSource==='file'?`<label>Scegli una canzone <input type=file accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" onchange="chooseMusicFile(this.files[0])"></label><p id=musicFilename class=muted>${escapeText(musicFile?.name||'Nessun file scelto')}</p>`:musicSource==='internal'?'<p class=muted>Nel selettore del browser scegli una scheda con musica e abilita Condividi audio. Dopo la selezione torna a questa pagina. Schermo e audio di sistema dipendono dal browser e dal sistema operativo; sul telefono potrebbero non essere disponibili. La schermata condivisa non viene salvata o inviata.</p>':'<p class=muted>Consenti il microfono del dispositivo da cui apri questa pagina.</p>'}<div id=musicPlayer></div><label>Sensibilità <input type=range min=1 max=20 step=0.5 value="${musicGain}" oninput="musicGain=+this.value" aria-label="Sensibilità del microfono"></label><label>Luminosità massima <input type=range min=10 max=100 value="${musicLimit}" oninput="musicLimit=+this.value" aria-label="Luminosità massima musicale"></label><meter id=musicLevel min=0 max=1 value=0 style="width:100%" aria-label="Intensità audio"></meter><div class=actions><button class="btn primary" onclick="startMusic()">▶ Avvia musica</button><button class=btn onclick="stopMusic()">■ Ferma musica</button></div><p id=musicStatus class=status role=status>${escapeText(musicMessage)}</p><p class=muted>L’audio viene analizzato qui e non viene salvato né trasmesso. Invii indipendenti: Shelly segue più colpi, Tapo può essere più lenta. I colpi troppo ravvicinati vengono accorpati senza creare una coda. Con il microfono, avvicinalo alle casse. Con un file, la musica viene riprodotta qui senza caricarla sul server. I download offline di Spotify non sono file audio utilizzabili.</p></section>
<section class=card><div class=name>🎛 Controllo stanza</div><p class=muted>Scegli le lampadine da controllare:</p><div class=checks>${ips.map(ip=>`<label class=check><input class=manual-target type=checkbox value="${ip}" ${S.disabled_devices?.[ip]?'disabled':manualSelections[room].includes(ip)?'checked':''} onchange="manualSelections[room]=manualTargets()">${S.data.devices[ip]?.name||ip}${S.disabled_devices?.[ip]?' · esclusa':''}</label>`).join('')}</div>${brightnessControl(roomBrightness,'room')}<div class="control-title"><span>☀ Bianco caldo → bianco freddo</span><output id="kelvin">${selectedCT} K</output></div><input id="ct" class="slider warmth" aria-label="Temperatura del bianco" type="range" min="2700" max="6500" value="${selectedCT}" oninput="selectedCT=+this.value;document.getElementById('kelvin').textContent=this.value+' K'" onchange="applyWhite()"><div class="control-title"><span>Colore</span><span>Trascina per scegliere</span></div><div id="spectrum" class="spectrum" role="slider" tabindex="0" aria-label="Spettro colori: frecce destra e sinistra per tonalità, su e giù per saturazione" aria-valuemin="0" aria-valuemax="360"><span id="marker" class="marker"></span></div><div class="preview"><span id="chip" class="chip"></span><span id="colorValue"></span></div><div class="control-title">Colori predefiniti</div><div class="presets">${presets.map(([name,hex,ct])=>`<button class="swatch" style="--swatch:${hex}" title="${name}" aria-label="${name}" aria-pressed="false" data-color="${hex}" onclick="preset('${hex}',${ct||0})"></button>`).join('')}</div><div class=actions><button class=btn onclick='set(manualTargets(),{on:true})'>Tutte ON</button><button class=btn onclick='set(manualTargets(),{on:false})'>Tutte OFF</button></div></section>
<section class=card><div class=row><div class=name>🎬 Scene</div><button class=btn onclick=saveScene()>＋ Salva</button></div><div class=scenes>${Object.keys(S.data.scenes[room]||{}).map(n=>`<button class=scene onclick='scene(${JSON.stringify(n)})'>▶ ${n}</button>`).join('')||'<span class=muted>Nessuna scena salvata</span>'}</div></section>`;
content.innerHTML=h;attachMusicPlayer();bindSpectrum();updateEffectOptions()}
async function set(ips,params){await stopMusic();if(!ips.length)return alert('Seleziona almeno una lampada');await api('/api/set',{ips,params});setTimeout(load,120)}
function escapeText(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function deviceEffectStatus(ip){if(S.music_active?.includes(ip))return '● Musica · browser attivo';let e=S.native_effects?.[ip];if(e?.error)return 'Stato effetto non disponibile';if(e?.lastError)return 'Errore effetto: '+escapeText(e.lastError.message);return e?.name?'● '+escapeText(e.name)+' · in esecuzione sulla lampadina':'Nessun effetto attivo'}
function roomEffectStatus(ips){return ips.map(ip=>escapeText(S.data.devices[ip]?.name||ip)+': '+deviceEffectStatus(ip)).join('<br>')||'Seleziona un effetto e le lampade.'}
function manualTargets(){return [...document.querySelectorAll('.manual-target:checked')].filter(x=>!x.disabled&&!S.disabled_devices?.[x.value]).map(x=>x.value)}
function updateEffectOptions(){let t=targets(),options=S.effects.filter(name=>t.every(ip=>(S.effects_by_device?.[ip]||S.effects).includes(name))),select=document.getElementById('fx');select.innerHTML=options.map(name=>`<option>${name}</option>`).join('');if(options.includes(selectedFX))select.value=selectedFX;else selectedFX=options[0]||''}
function targets(){return [...document.querySelectorAll('.target:checked')].filter(x=>!x.disabled&&!S.disabled_devices?.[x.value]).map(x=>x.value)}
async function startfx(){await stopMusic();let t=targets();if(!t.length)return alert('Seleziona almeno una lampada');let name=document.getElementById('fx').value;document.getElementById('fxst').textContent='Avvio sulla lampadina… Il primo avvio carica lo script.';let result=await api('/api/effect/start',{room,name,ips:t});if(result.ok)await load();else document.getElementById('fxst').textContent='Avvio non riuscito: '+result.error}
async function stopfx(){await stopMusic();let t=targets();if(!t.length)return alert('Seleziona almeno una lampada');let result=await api('/api/effect/stop',{room,ips:t});if(result.ok)await load()}
function colorRoom(h){let rgb=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));set(manualTargets(),{mode:'rgb',rgb})}
async function saveScene(){let n=prompt('Nome scena (es. Cena, Cinema):');if(n){await api('/api/scene/save',{room,name:n,ips:S.data.rooms[room]});await load()}}
async function scene(n){await stopMusic();await api('/api/scene/apply',{room,name:n});setTimeout(load,150)}
load(true);setInterval(()=>{if(!music && !dragging && !document.activeElement?.matches('input[type=range],#spectrum'))load()},10000);
</script></body></html>
